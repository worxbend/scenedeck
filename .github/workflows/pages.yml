name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # GITHUB_TOKEN-created releases do not trigger downstream workflows;
  # dispatch Pages manually for those. Manual/App-created releases do trigger it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static site (read-only token)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release redeploys the maintained site, not historical tagged copy.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked site tools without lifecycle scripts
        working-directory: site/tools
        run: npm ci --ignore-scripts
      - name: Test site behavior and deployment checker fixtures
        working-directory: site/tools
        run: npm test
      - name: Check authored site and generated provenance
        working-directory: site/tools
        run: npm run check
      - name: Audit locked site dependencies
        working-directory: site/tools
        run: npm audit
      - name: Stamp release metadata into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/tools/stamp-release.sh
      - name: Validate deployment cache stamps against checked-out source
        run: node site/tools/check.mjs --build "$(git rev-parse HEAD)"
      - name: Strip build sources from the artifact
        run: rm -rf site/tools site/README.md site/package.json site/package-lock.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy prepared site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
