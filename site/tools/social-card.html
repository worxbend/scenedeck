<!doctype html>
<!--
  Source for assets/social.png (the Open Graph preview). Regenerate with:

    python3 -m http.server -d site 8899 &
    chromium --headless --window-size=1200,630 \
      --screenshot=site/assets/social.png http://localhost:8899/tools/social-card.html

  It is a page rather than a hand-drawn SVG so the card uses the same fonts and
  the same tokens as the site itself, and cannot drift from them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SceneDeck social card</title>
    <link rel="stylesheet" href="../fonts/fonts.css" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      html[data-theme="dark"] {
        color-scheme: dark;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #0e0c13;
        color: #e7e1f0;
        font-family: var(--font-text);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 72px;
        box-sizing: border-box;
      }

      /* The same softbox-lit rack the site's WebGL layer paints, flattened. */
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(680px 460px at 18% 8%, rgba(111, 120, 255, 0.4), transparent 70%),
          radial-gradient(460px 380px at 88% 26%, rgba(255, 190, 111, 0.14), transparent 68%);
      }

      .rack {
        position: absolute;
        inset: 0;
        opacity: 0.5;
      }

      .rack i {
        position: absolute;
        height: 34px;
        border-radius: 7px;
        background: linear-gradient(180deg, #4a4459, #2b2739);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 6px 14px rgba(0, 0, 0, 0.4);
      }

      .inner {
        position: relative;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 82px;
        line-height: 0.9;
        letter-spacing: -0.04em;
        max-width: 17ch;
      }

      .signal {
        color: #ffd700;
      }

      .foot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 26px;
        font-family: var(--font-mono);
        font-size: 19px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c9c2d6;
      }

      .foot b {
        color: #c2c3ff;
        font-weight: 500;
      }

      .rule {
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, #4d8ff0, transparent);
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="rack">
      <i style="left: -40px; top: 96px; width: 300px"></i>
      <i style="left: 300px; top: 40px; width: 250px"></i>
      <i style="left: 830px; top: 120px; width: 330px"></i>
      <i style="left: 980px; top: 220px; width: 290px"></i>
      <i style="left: 700px; top: 470px; width: 380px"></i>
      <i style="left: -20px; top: 520px; width: 220px"></i>
      <i style="left: 1090px; top: 372px; width: 240px"></i>
    </div>

    <div class="brand inner">
      <img src="../assets/icon.svg" width="52" height="52" alt="" />
      SceneDeck
    </div>

    <h1 class="inner">
      Stream from one machine.<br />Control it from <span class="signal">another</span>.
    </h1>

    <div class="foot">
      <span><b>OBS Studio remote</b></span>
      <span>Rust + GTK4</span>
      <span>MIT</span>
      <span class="rule"></span>
      <span>worxbend.github.io/scenedeck</span>
    </div>
  </body>
</html>
