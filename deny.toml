[advisories]
version = 2
yanked = "deny"
unused-ignored-advisory = "deny"
# cargo-deny 0.20.2 has no expiry field; CI checks the record before either scanner.
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "Temporary maintenance-only acceptance: basic-toml 0.1.10 via i18n-config 0.4.8 in localization proc macros; no compatible published fix; cargo-i18n PR #176 is unreleased. Remove earlier when a compatible fixed release is available. Owner: SceneDeck maintainer. Expires: 2026-11-20 00:00:00 UTC." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
