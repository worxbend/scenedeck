name: linux release

on:
  push:
    tags:
      - 'v*'
  # Manual runs validate/build only, including when dispatched on a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.scenedeck.app
  BIN_NAME: scenedeck

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Cargo, AppStream, tag and immutable commit
        id: source
        run: |
          args=(--commit "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--tag "$GITHUB_REF_NAME" --remote)
          fi
          python3 tools/verify-source.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes without publication credentials
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
          github_token: ${{ github.token }}
        env:
          OUTPUT: release-notes.md
      - run: test -s release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
    # No secrets are passed into the unprivileged reusable gates.

  build-linux:
    name: Build Linux ${{ matrix.artifact_arch }} release artifacts
    needs: [prepare, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - artifact_arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install Linux packaging dependencies
        run: |
          # Use distro packages. Flatpak SDK availability is optional and is
          # reported from the actual build outcome, not an unverified PPA claim.
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            desktop-file-utils \
            file \
            flatpak \
            flatpak-builder \
            jq \
            libadwaita-1-dev \
            libdbus-1-dev \
            libfuse2t64 \
            libglib2.0-dev \
            libgtk-4-dev \
            librsvg2-bin \
            ostree \
            patchelf \
            pkg-config \
            wget \
            zsync

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # reviewed 2026-10-19
        with:
          toolchain: '1.99.1'

      - name: Verify build source identity
        run: |
          python3 tools/verify-source.py --commit "$COMMIT"

      - name: Validate desktop metadata
        run: |
          desktop-file-validate "data/${APP_ID}.desktop"
          appstreamcli validate --no-net "data/${APP_ID}.metainfo.xml"

      - name: Render release icon
        run: |
          mkdir -p build-assets
          rsvg-convert -w 256 -h 256 "assets/${APP_ID}.svg" -o "build-assets/${APP_ID}.png"

      - name: Build release binary
        run: cargo build --release --locked --all-features

      - name: Stage standalone executable
        run: |
          install -Dm755 \
            "target/release/${BIN_NAME}" \
            "${BIN_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}"

      - name: Package release tarball
        run: |
          package="${BIN_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}"
          mkdir -p \
            "dist/${package}/usr/bin" \
            "dist/${package}/usr/share/applications" \
            "dist/${package}/usr/share/icons/hicolor/scalable/apps" \
            "dist/${package}/usr/share/icons/hicolor/256x256/apps" \
            "dist/${package}/usr/share/metainfo"

          install -Dm755 "target/release/${BIN_NAME}" "dist/${package}/usr/bin/${BIN_NAME}"
          install -Dm644 "data/${APP_ID}.desktop" "dist/${package}/usr/share/applications/${APP_ID}.desktop"
          install -Dm644 "data/${APP_ID}.metainfo.xml" "dist/${package}/usr/share/metainfo/${APP_ID}.metainfo.xml"
          install -Dm644 "assets/${APP_ID}.svg" "dist/${package}/usr/share/icons/hicolor/scalable/apps/${APP_ID}.svg"
          install -Dm644 "build-assets/${APP_ID}.png" "dist/${package}/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png"

          tar -czf "${package}.tar.gz" -C dist "${package}"

      - name: Build AppImage
        run: |
          appdir="${BIN_NAME}.AppDir"
          rm -rf "${appdir}"
          mkdir -p \
            "${appdir}/usr/bin" \
            "${appdir}/usr/share/applications" \
            "${appdir}/usr/share/icons/hicolor/scalable/apps" \
            "${appdir}/usr/share/icons/hicolor/256x256/apps" \
            "${appdir}/usr/share/metainfo"

          install -Dm755 "target/release/${BIN_NAME}" "${appdir}/usr/bin/${BIN_NAME}"
          install -Dm755 packaging/appimage/AppRun "${appdir}/AppRun"
          install -Dm644 "data/${APP_ID}.desktop" "${appdir}/usr/share/applications/${APP_ID}.desktop"
          install -Dm644 "data/${APP_ID}.metainfo.xml" "${appdir}/usr/share/metainfo/${APP_ID}.metainfo.xml"
          install -Dm644 "assets/${APP_ID}.svg" "${appdir}/usr/share/icons/hicolor/scalable/apps/${APP_ID}.svg"
          install -Dm644 "build-assets/${APP_ID}.png" "${appdir}/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png"

          ln -sf "usr/share/applications/${APP_ID}.desktop" "${appdir}/${APP_ID}.desktop"
          ln -sf "usr/share/icons/hicolor/256x256/apps/${APP_ID}.png" "${appdir}/${APP_ID}.png"
          ln -sf "usr/share/icons/hicolor/256x256/apps/${APP_ID}.png" "${appdir}/.DirIcon"

          # These existing URLs serve mutable continuous-release assets. Keep
          # the reviewed content hashes: if upstream replaces a file, fail closed
          # rather than silently trusting new bytes. Immutable mirroring is separate.
          wget -q -O linuxdeploy-${APPIMAGE_ARCH}.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${APPIMAGE_ARCH}.AppImage
          wget -q -O appimagetool-${APPIMAGE_ARCH}.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage

          case "${APPIMAGE_ARCH}" in
            x86_64)
              echo "36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62  linuxdeploy-x86_64.AppImage" | sha256sum --check --strict
              echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool-x86_64.AppImage" | sha256sum --check --strict
              ;;
            aarch64)
              echo "556ab80baa98e600aa80f0dcedfb70bca0e1ce7e9f147fb345be3fcc3e91b2b1  linuxdeploy-aarch64.AppImage" | sha256sum --check --strict
              echo "1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe  appimagetool-aarch64.AppImage" | sha256sum --check --strict
              ;;
          esac

          chmod +x linuxdeploy-${APPIMAGE_ARCH}.AppImage appimagetool-${APPIMAGE_ARCH}.AppImage

          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-${APPIMAGE_ARCH}.AppImage \
            --appdir "${appdir}" \
            --executable "${appdir}/usr/bin/${BIN_NAME}" \
            --desktop-file "${appdir}/usr/share/applications/${APP_ID}.desktop" \
            --icon-file "${appdir}/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png"

          install -Dm755 packaging/appimage/AppRun "${appdir}/AppRun"

          update_info="gh-releases-zsync|worxbend|scenedeck|latest|${BIN_NAME}-*-linux-${ARTIFACT_ARCH}.AppImage"

          ARCH=${APPIMAGE_ARCH} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-${APPIMAGE_ARCH}.AppImage \
            --updateinformation "${update_info}" \
            "${appdir}" \
            "${BIN_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"

      # Flathub runtimes/SDKs may be unavailable. Never disguise this as a
      # mandatory format: record the real outcome in the release manifest.
      - name: Build optional Flatpak bundle
        id: flatpak
        timeout-minutes: 20
        continue-on-error: true
        run: |
          rm -rf target
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --state-dir="$RUNNER_TEMP/flatpak-state-$ARTIFACT_ARCH" \
            --repo="$RUNNER_TEMP/flatpak-repo-$ARTIFACT_ARCH" \
            "$RUNNER_TEMP/flatpak-build-$ARTIFACT_ARCH" "packaging/flatpak/${APP_ID}.yml"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/flatpak-repo-$ARTIFACT_ARCH" \
            "${BIN_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}.flatpak" "$APP_ID"

      - name: Report a skipped Flatpak bundle
        if: steps.flatpak.outcome != 'success'
        run: |
          echo "::warning::Flatpak unavailable for $ARTIFACT_ARCH; no bundle is shipped for this architecture."
          echo "Flatpak ($ARTIFACT_ARCH): unavailable; see build log." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and checksum the exact artifact set before upload
        env:
          FLATPAK_OUTCOME: ${{ steps.flatpak.outcome }}
        run: |
          base="${BIN_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}"
          mkdir release-assets
          args=()
          mv "$base" "$base.tar.gz" "$base.AppImage" release-assets/
          if [[ "$FLATPAK_OUTCOME" == success ]]; then
            mv "$base.flatpak" release-assets/
            args+=(--flatpak)
          else
            rm -f "$base.flatpak"
          fi
          if [[ -e "$base.AppImage.zsync" ]]; then
            mv "$base.AppImage.zsync" release-assets/
            args+=(--zsync)
          fi
          python3 tools/verify-release.py create --directory release-assets \
            --version "$VERSION" --commit "$COMMIT" --arch "$ARTIFACT_ARCH" "${args[@]}"
          # GitHub artifact ZIPs reset file modes. Transfer a tar to retain them.
          (cd release-assets && tar -cf "../release-${ARTIFACT_ARCH}.tar" -- *)

      - name: Upload Linux ${{ matrix.artifact_arch }} artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenedeck-linux-${{ matrix.artifact_arch }}-release
          path: release-${{ matrix.artifact_arch }}.tar
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Verify draft assets and publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, validate, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: github-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Checkout exactly the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Download amd64 transfer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenedeck-linux-amd64-release
          path: transfers
          digest-mismatch: error
      - name: Download arm64 transfer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenedeck-linux-arm64-release
          path: transfers
          digest-mismatch: error
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
          digest-mismatch: error
      - name: Install native offline bundle inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
      - name: Revalidate tag, architectures, exact filenames and all checksums
        run: |
          python3 tools/verify-source.py --commit "$COMMIT" --tag "$GITHUB_REF_NAME" --remote
          for arch in amd64 arm64; do
            python3 tools/verify-release.py extract --archive "transfers/release-$arch.tar" \
              --directory release-artifacts --version "$VERSION" --commit "$COMMIT" --arch "$arch"
          done
          python3 tools/verify-release.py verify --directory release-artifacts \
            --version "$VERSION" --commit "$COMMIT" --arch amd64 --arch arm64
          test -s notes/release-notes.md
          printf '\n### Artifact availability\n' >> notes/release-notes.md
          for arch in amd64 arm64; do
            base="${BIN_NAME}-${VERSION}-linux-${arch}"
            flatpak=unavailable
            zsync=unavailable
            if [[ -f "release-artifacts/$base.flatpak" ]]; then flatpak=included; fi
            if [[ -f "release-artifacts/$base.AppImage.zsync" ]]; then zsync=included; fi
            printf -- '- %s: executable, tarball and AppImage; Flatpak: %s; zsync: %s.\n' \
              "$arch" "$flatpak" "$zsync" >> notes/release-notes.md
          done
      - name: Stage a new draft, read back every asset byte, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No clobber/reuse: an existing draft or published release must fail.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$COMMIT" --draft --prerelease=false --latest=false --title "$GITHUB_REF_NAME" \
            --notes-file notes/release-notes.md release-artifacts/*
          readback="$(mktemp -d "$RUNNER_TEMP/release-readback.XXXXXX")"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$readback"
          python3 tools/verify-release.py verify --downloaded --directory "$readback" \
            --version "$VERSION" --commit "$COMMIT" --arch amd64 --arch arm64
          diff -qr release-artifacts "$readback"
          python3 tools/verify-source.py --commit "$COMMIT" --tag "$GITHUB_REF_NAME" --remote
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft \
            | python3 -c 'import json,os,sys; r=json.load(sys.stdin); assert r["tagName"] == os.environ["GITHUB_REF_NAME"] and r["isDraft"] is False'

  promote-latest:
    name: Promote highest published stable version without regressing latest
    needs: [prepare, validate, publish-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-release
    permissions:
      contents: write
    # Serialize only pointer reconciliation across ALL tags. Builds and verified
    # publication remain independent; no latest=true write occurs outside here.
    # Pending jobs may be replaced, so the helper scans every published version.
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Compare numeric versions, promote and read back the latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote-latest.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
