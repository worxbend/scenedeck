[package]
name = "scenedeck"
version = "0.5.0"
edition = "2021"
license = "MIT"

[dependencies]
adw     = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk4    = { package = "gtk4",       version = "0.11", features = ["v4_10"] }
gio     = "0.22"
glib    = "0.22"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.0", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
time = "0.3"
obws         = { version = "0.15", features = ["events"] }
futures-util = "0.3"
# Synchronous Secret Service client. NOTE: despite the "crypto-rust" feature
# name, the sync backend (sync-secret-service → dbus-secret-service → dbus)
# links the system libdbus-1 — it is a build requirement, not dead weight.
# A pure-Rust zbus backend exists but is async-only; adopting it means making
# secret.rs await and is a deliberate migration, not a cleanup.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
nerd_gtk_icons = "0.1"
libc = "0.2"
cssparser = { version = "0.38", default-features = false }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
tokio-websockets = { version = "0.13", features = ["server"] }
